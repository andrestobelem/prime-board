<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>prime-board</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Aplica el tema resuelto antes de cargar el bundle para evitar flash (FOUC).
      (function () {
        var context = null;
        try {
          context = JSON.parse(localStorage.getItem("pb.ui.context") || "null");
        } catch (_) {}
        var key = localStorage.getItem("pb.apiKey") || "";
        var identity =
          context && context.workspaceId && context.actorId
            ? context.workspaceId + ":" + context.actorId
            : key;
        var hash = 2166136261;
        for (var index = 0; index < identity.length; index += 1) {
          hash ^= identity.charCodeAt(index);
          hash = Math.imul(hash, 16777619);
        }
        var namespace =
          context && context.workspaceId && context.actorId
            ? "workspace-" + (hash >>> 0).toString(36)
            : key
              ? "credential-" + (hash >>> 0).toString(36)
              : "anonymous";
        var stored = localStorage.getItem("pb.ui." + namespace + ".theme");
        var preference = stored === "dark" || stored === "light" ? stored : "system";
        var dark =
          preference === "dark" ||
          (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
