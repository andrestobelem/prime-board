[project]
name = "prime-board-workflow"
version = "0.1.0"
description = "Diagnose and call the authenticated prime-board MCP endpoint from Prime Agent."
requires-python = ">=3.10"
dependencies = ["mcp>=1.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prime_board_workflow"]
